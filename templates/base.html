<style>

    :root {
        --blood-red: #b30000;
        --blood-red-dark: #8b0000;
        --navy: #102a43;
        --navy-dark: #071d2f;
        --light-bg: #f4f7fb;
        --white: #ffffff;
        --text: #243447;
    }

    body {
        margin: 0;
        padding: 0;
        background: var(--light-bg);
        font-family: Arial, sans-serif;
        color: var(--text);
    }

    /* NAVBAR */

    .navbar {
        background: linear-gradient(
            135deg,
            var(--blood-red),
            var(--blood-red-dark)
        ) !important;

        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    }

    .navbar-brand {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.3px;
    }

    .nav-link {
        font-weight: 600;
        margin: 0 3px;
        border-radius: 20px;
        padding: 8px 12px !important;
        transition: 0.25s;
    }

    .nav-link:hover {
        background: rgba(255, 255, 255, 0.18);
    }

    /* PAGE */

    main {
        min-height: 65vh;
    }

    /* CARDS */

    .card {
        border: none;
        border-radius: 18px;
        background: var(--white);
        box-shadow: 0 5px 18px rgba(16, 42, 67, 0.08);
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 28px rgba(16, 42, 67, 0.15);
    }

    /* BUTTONS */

    .btn {
        border-radius: 30px;
        font-weight: 700;
        transition: 0.25s;
    }

    .btn-danger {
        background: var(--blood-red);
        border-color: var(--blood-red);
    }

    .btn-danger:hover {
        background: var(--blood-red-dark);
        border-color: var(--blood-red-dark);
        transform: translateY(-1px);
    }

    /* FOOTER */

    footer {
        margin-top: 50px;
        background: linear-gradient(
            135deg,
            var(--navy-dark),
            var(--navy)
        ) !important;
    }

    footer a {
        transition: 0.2s;
    }

    footer a:hover {
        color: #ff6b6b !important;
        padding-left: 4px;
    }

    /* MOBILE */

    @media (max-width: 768px) {

        .navbar-brand {
            font-size: 23px;
        }

        .nav-link {
            margin: 2px 0;
        }

        .container {
            max-width: 100%;
        }

        main {
            min-height: 70vh;
        }

    }

</style>
