<!DOCTYPE html>
<html>
<head>
    <title>BloodLink</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>

.card:hover {

    transform: translateY(-8px);
    transition: 0.3s;

}

img:hover {

    transform: scale(1.03);
    transition: 0.3s;

}

</style>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🩸 BloodLink
        </a>


        <button class="navbar-toggler" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="navbarMenu">


            <ul class="navbar-nav ms-auto">


                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Home
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/donors/">
                        Donors
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/request-blood/">
                        Request Blood
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/blood-requests/">
                        Blood Requests
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/about/">
                        About
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/contact/">
                        Contact
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/profile/">
                        Profile
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/logout/">
                        Logout
                    </a>
                </li>


            </ul>


        </div>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>


<footer class="bg-dark text-white text-center mt-5 p-4">

    <div class="container">

        <h4>
            🩸 BloodLink
        </h4>

        <p>
            Donate Blood, Save Lives ❤️
        </p>


        <div class="mb-3">

            <a href="#" class="text-white me-3">
                Facebook
            </a>

            <a href="#" class="text-white me-3">
                Instagram
            </a>

            <a href="#" class="text-white">
                Twitter
            </a>

        </div>


        <hr>


        <p class="mb-0">
            &copy; 2026 BloodLink - Blood Donation Management System
        </p>

        <p class="mb-0">
            Developed by <strong>Arvind Pund</strong>
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
