{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodLink - Blood Donation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        .navbar-brand {
            font-size: 1.4rem;
        }

        .nav-link {
            font-weight: 500;
        }

        .hero {
            background: linear-gradient(135deg, #b30000, #e63946);
            border-radius: 25px;
            padding: 55px 25px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .hero h1 {
            font-weight: 800;
        }

        .hero p {
            max-width: 700px;
            margin: auto;
        }

        .btn-custom {
            border-radius: 30px;
            padding: 12px 25px;
            font-weight: 600;
        }

        .main-banner {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .card {
            border: none;
            border-radius: 18px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .stat-icon {
            font-size: 40px;
        }

        .emergency {
            background: linear-gradient(135deg, #dc3545, #9b0000);
            border-radius: 20px;
            color: white;
            padding: 35px 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .info-img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        footer {
            margin-top: 60px;
        }

        footer a {
            text-decoration: none;
        }

        @media (max-width: 768px) {

            .main-banner {
                height: 200px;
            }

            .hero {
                padding: 40px 20px;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero .btn {
                width: 100%;
                margin: 6px 0;
            }

        }
    </style>
</head>
