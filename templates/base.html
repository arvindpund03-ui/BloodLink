{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BloodLink</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        :root {
            --blood-red: #b30000;
            --blood-red-dark: #8b0000;
            --navy: #102a43;
            --navy-dark: #071d2f;
            --light-bg: #f4f7fb;
            --white: #ffffff;
            --text: #243447;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--light-bg);
            font-family: Arial, sans-serif;
            color: var(--text);
        }

        .navbar {
            background: linear-gradient(
                135deg,
                var(--blood-red),
                var(--blood-red-dark)
            ) !important;

            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .nav-link {
            font-weight: 600;
            margin: 0 3px;
            border-radius: 20px;
            padding: 8px 12px !important;
            transition: 0.25s;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        main {
            min-height: 65vh;
        }

        .card {
            border: none;
            border-radius: 18px;
            background: var(--white);
            box-shadow: 0 5px 18px rgba(16, 42, 67, 0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(16, 42, 67, 0.15);
        }

        .btn {
            border-radius: 30px;
            font-weight: 700;
            transition: 0.25s;
        }

        .btn-danger {
            background: var(--blood-red);
            border-color: var(--blood-red);
        }

        .btn-danger:hover {
            background: var(--blood-red-dark);
            border-color: var(--blood-red-dark);
            transform: translateY(-1px);
        }

        footer {
            margin-top: 50px;
            background: linear-gradient(
                135deg,
                var(--navy-dark),
                var(--navy)
            ) !important;
        }

        footer a {
            transition: 0.2s;
        }

        footer a:hover {
            color: #ff6b6b !important;
            padding-left: 4px;
        }

        @media (max-width: 768px) {

            .navbar-brand {
                font-size: 23px;
            }

            .nav-link {
                margin: 2px 0;
            }

            .container {
                max-width: 100%;
            }

            main {
                min-height: 70vh;
            }

        }

    </style>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">

    <div class="container">

        <a class="navbar-brand" href="/">
            🩸 BloodLink
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
            aria-controls="navbarMenu"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        🏠 Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/donors/">
                        🩸 Donors
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="{% url 'notifications' %}">
                        🔔 Notifications
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/request-blood/">
                        🚑 Request Blood
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/about/">
                        ℹ️ About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/contact/">
                        📞 Contact
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/profile/">
                        👤 Profile
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/logout/">
                        🚪 Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =========================
     PAGE CONTENT
========================= -->

<main>

    {% block content %}
    {% endblock %}

</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="text-white py-4">

    <div class="container text-center">

        <h5 class="fw-bold">
            🩸 BloodLink
        </h5>

        <p class="mb-2">
            Connecting blood donors with people in need.
        </p>

        <p class="mb-0">
            © 2026 BloodLink. All rights reserved.
        </p>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
