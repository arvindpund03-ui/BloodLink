<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency Blood Request | BloodLink</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #b00020;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #b00020;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #b00020;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #8f0019;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #555;
        }

        .errorlist {
            color: #b00020;
            margin: 5px 0;
            padding-left: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚨 Emergency Blood Request</h1>

    <p class="subtitle">
        Submit an urgent blood requirement and connect with available donors.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}

            <div class="form-group">

                {{ field.label_tag }}

                {{ field }}

                {{ field.errors }}

            </div>

        {% endfor %}

        <button type="submit" class="btn">
            🚨 Submit Emergency Request
        </button>

    </form>

    <a href="{% url 'home' %}" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
